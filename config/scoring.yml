# Scoring parameters. The formula is in the scoring-and-ranking section of
# docs/requirement.md. Day-to-day tuning happens here, not in code.
final_score:
  objective: 0.35
  importance: 0.45
  relevance: 0.20 # not used until M3; final score renormalizes over active components
importance:
  scope: 0.4
  durability: 0.4
  novelty: 0.2
objective:
  breadth: 0.40
  growth: 0.25
  source_quality: 0.25
  community: 0.10
clustering:
  similarity_threshold: 0.72
objective_signals:
  # Log-saturation caps: roughly how many sources / recent articles it
  # takes to approach a full breadth / growth score (D-010).
  source_cap: 15
  recent_cap: 10
  # Breadth multiplier when every source shares one language and one
  # region: local pileups must not read as global coverage.
  monolocal_discount: 0.7
  # Growth counts articles published within this window.
  growth_window_hours: 24
stream:
  half_life_hours: 24 # time-decay half-life for the live stream ordering
offcircle_ratio: 0.20 # share of off-circle (bubble-breaking) items, from M3
pipeline:
  # Per-cycle batch caps; they bound one worker cycle's LLM spend.
  summary_batch_limit: 50
  embed_batch_limit: 200
  score_batch_limit: 40
  # Give up summarizing an article after this many failed cycles.
  max_summary_failures: 3
viewpoints:
  # Eligibility gate (D-011): an event earns a viewpoint comparison only
  # with >= min_sources distinct sources spanning >= min_regions regions
  # OR >= min_kinds source kinds.
  min_sources: 3
  min_regions: 2
  min_kinds: 2
  # Per-cycle cap on viewpoint LLM attempts (successful or not).
  viewpoint_batch_limit: 10
digest:
  digest_hour: 8
  digest_timezone: Asia/Shanghai
  top_n: 10
