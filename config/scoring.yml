# Scoring parameters. The formula is in the scoring-and-ranking section of
# docs/requirement.md. Day-to-day tuning happens here, not in code.
final_score:
  objective: 0.35
  importance: 0.45
  relevance: 0.20 # not used until M3; final score renormalizes over active components
importance:
  scope: 0.4
  durability: 0.4
  novelty: 0.2
objective:
  breadth: 0.40
  growth: 0.25
  source_quality: 0.25
  community: 0.10
clustering:
  similarity_threshold: 0.72
stream:
  half_life_hours: 24 # time-decay half-life for the live stream ordering
offcircle_ratio: 0.20 # share of off-circle (bubble-breaking) items, from M3
