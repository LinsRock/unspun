# Source list. M1 entries use official RSS; from M2 on, rsshub://<route>
# URLs resolve against the self-hosted RSSHub (UNSPUN_RSSHUB_URL). Every URL
# below was verified working from the VPS at the date noted in its section.
#
# Field conventions (see the source-list-and-weights section of docs/requirement.md):
#   id: unique identifier    name: display name    url: RSS feed URL or rsshub://route
#   weight: 0.3-1.0 (A=1.0 wire/primary ... F=0.3 community)
#   region: cn-mainland | hk-tw | us | eu | jp | me | intl
#   kind: wire | public | commercial | state | independent | community | academic | official
#   lang: zh | en
#   max_items: optional per-fetch cap for high-volume feeds
#   timeout_seconds: optional per-feed fetch timeout (RSSHub cold-cache routes are slow)
#
# Dropped after M2 T2 validation (see docs/tasks/m2.md, source validation log):
# Jiemian (origin unreachable from the overseas VPS), Jiqizhixin (no RSSHub
# route; official RSS discontinued).
