services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"

  # worker 复用 api 构建出的 unspun-server:dev 镜像，不单独定义 build

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
