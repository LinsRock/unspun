name: unspun

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: unspun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unspun}
      POSTGRES_DB: unspun
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unspun"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${SERVER_IMAGE:-unspun-server:dev}
    environment:
      UNSPUN_DATABASE_URL: postgresql+psycopg://unspun:${POSTGRES_PASSWORD:-unspun}@db:5432/unspun
      UNSPUN_APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ${SERVER_IMAGE:-unspun-server:dev}
    command: ["python", "-m", "unspun.pipeline.main"]
    environment:
      UNSPUN_DATABASE_URL: postgresql+psycopg://unspun:${POSTGRES_PASSWORD:-unspun}@db:5432/unspun
      UNSPUN_APP_VERSION: ${APP_VERSION:-dev}
      UNSPUN_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-unspun-web:dev}
    depends_on:
      - api

  # Self-hosted RSSHub for sources without an official feed (see D-008).
  # Internal network only: never publish a host port here (the local overlay
  # maps it to loopback for host-run dev). Worker reaches it at rsshub:1200.
  rsshub:
    image: diygod/rsshub:2026-10-09
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "1800"
      CACHE_CONTENT_EXPIRE: "3600"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1200/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
