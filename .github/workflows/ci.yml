name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

# GHCR image names must be all lowercase; github.repository cannot be used
# directly because "LinsRock" contains uppercase letters.
env:
  SERVER_IMAGE: ghcr.io/linsrock/unspun-server
  WEB_IMAGE: ghcr.io/linsrock/unspun-web

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
      prototype: ${{ steps.scope.outputs.prototype }}
      deploy: ${{ steps.scope.outputs.deploy }}
      server_image: ${{ steps.scope.outputs.server_image }}
      web_image: ${{ steps.scope.outputs.web_image }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/tests -v
      - id: scope
        run: python3 .github/scripts/ci_scope.py
        env:
          GH_TOKEN: ${{ github.token }}

  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            build
            refactor
            test
            perf
            chore
          scopes: |
            server
            web
            deploy
            config
            docs
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >
            The subject must start lowercase and must not end with a period.
      - name: Check for CJK text outside docs/
        run: |
          # English-only repo except docs/ (Chinese product docs) and UI copy
          # in web/src (Chinese product UI; comments there must be English).
          fail=0
          while IFS= read -r f; do
            case "$f" in
              docs/*) continue ;;
              web/src/*)
                if grep -nIE '//|/\*|^\s*\*' "$f" | grep -P '[\x{4E00}-\x{9FFF}]'; then
                  echo "::error file=$f::Chinese text in comments; comments must be English"
                  fail=1
                fi
                ;;
              *)
                if grep -nIP '[\x{4E00}-\x{9FFF}]' "$f"; then
                  echo "::error file=$f::Chinese text outside docs/; repo content must be English"
                  fail=1
                fi
                ;;
            esac
          done < <(git ls-files)
          exit "$fail"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: unspun
          POSTGRES_PASSWORD: unspun
          POSTGRES_DB: unspun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unspun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UNSPUN_DATABASE_URL: postgresql+psycopg://unspun:unspun@localhost:5432/unspun_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Verify frozen M3-B event-set ranking
        run: >-
          uv run python -m unspun.evaluation.run_feed_ranking
          --snapshot ../docs/evaluations/m3b/technical-candidates.json
          --annotations ../docs/evaluations/m3b/technical-annotations.json
          --output /tmp/m3b-ranking-report.json

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run
      - run: pnpm build
      - name: Install PWA test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production PWA offline behavior
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/unspun-pwa-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:4173/ > /dev/null
          PWA_BASE_URL=http://127.0.0.1:4173 pnpm test:pwa

  admin-prototype:
    needs: changes
    if: needs.changes.outputs.prototype == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/design/m3a-admin-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  deploy-safety:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/deploy.sh
      - run: python3 -m unittest discover -s deploy/tests -v

  required-checks:
    if: always()
    needs: [changes, conventions, server, web, admin-prototype, deploy-safety]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/ci_scope.py --verify-needs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  build-push:
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.required-checks.result == 'success' &&
      needs.changes.outputs.release == 'true'
    needs: [changes, required-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: needs.changes.outputs.server_image == 'true' || needs.changes.outputs.web_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.server_image == 'true' || needs.changes.outputs.web_image == 'true'
      - uses: docker/build-push-action@v6
        if: needs.changes.outputs.server_image == 'true'
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        if: needs.changes.outputs.web_image == 'true'
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    concurrency:
      group: unspun-production-deploy
      cancel-in-progress: false
    # Enable by setting the repo variable DEPLOY_ENABLED=true once the
    # Cloudflare Access SSH app and the secrets below are configured.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      needs.changes.result == 'success' && needs.build-push.result == 'success'
    needs: [changes, build-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check release is current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision will publish the cumulative changes."
          fi
      - name: Install cloudflared
        if: steps.current.outputs.release == 'true'
        run: |
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      # Pasted secrets often pick up stray newlines/spaces; trim them before
      # exporting for all later steps.
      - name: Export Access service token
        if: steps.current.outputs.release == 'true'
        env:
          RAW_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAW_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          {
            printf 'TUNNEL_SERVICE_TOKEN_ID=%s\n' "$(printf %s "$RAW_ID" | tr -d '[:space:]')"
            printf 'TUNNEL_SERVICE_TOKEN_SECRET=%s\n' "$(printf %s "$RAW_SECRET" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
      - name: Preflight Access check
        if: steps.current.outputs.release == 'true'
        run: |
          code=$(curl --connect-timeout 5 --max-time 15 -s -o /dev/null -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${TUNNEL_SERVICE_TOKEN_ID}" \
            -H "CF-Access-Client-Secret: ${TUNNEL_SERVICE_TOKEN_SECRET}" \
            "https://${{ secrets.VPS_SSH_HOSTNAME }}/")
          echo "Access preflight HTTP ${code} (302 = token rejected, anything else = allowed)"
          test "${code}" != "302"
      - name: Configure SSH over Cloudflare Tunnel
        if: steps.current.outputs.release == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_SSH_HOSTNAME }}
            User ${{ secrets.VPS_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $TUNNEL_SERVICE_TOKEN_ID" --header "CF-Access-Client-Secret: $TUNNEL_SERVICE_TOKEN_SECRET"
          EOF
      - name: Sync deploy files
        if: steps.current.outputs.release == 'true'
        run: |
          scp -r deploy "vps:~/unspun/"
      - name: Deploy
        if: steps.current.outputs.release == 'true'
        env:
          RELEASE_SERVER_IMAGE: ${{ needs.changes.outputs.server_image == 'true' && format('{0}:{1}', env.SERVER_IMAGE, github.sha) || '' }}
          RELEASE_WEB_IMAGE: ${{ needs.changes.outputs.web_image == 'true' && format('{0}:{1}', env.WEB_IMAGE, github.sha) || '' }}
        run: |
          ssh vps "SERVER_IMAGE='${RELEASE_SERVER_IMAGE}' \
                   WEB_IMAGE='${RELEASE_WEB_IMAGE}' \
                   APP_VERSION=${{ github.sha }} \
                   bash ~/unspun/deploy/deploy.sh"
