name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# GHCR 镜像名必须全小写，不能直接用 github.repository（LinsRock 含大写）
env:
  SERVER_IMAGE: ghcr.io/linsrock/unspun-server
  WEB_IMAGE: ghcr.io/linsrock/unspun-web

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run
      - run: pnpm build

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: [server, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    # Enable by setting the repo variable DEPLOY_ENABLED=true once the
    # Cloudflare Access SSH app and the secrets below are configured.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      # secrets 粘贴时容易混入换行/空格，先清洗再导出给后续所有步骤
      - name: Export Access service token
        env:
          RAW_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          RAW_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          {
            printf 'TUNNEL_SERVICE_TOKEN_ID=%s\n' "$(printf %s "$RAW_ID" | tr -d '[:space:]')"
            printf 'TUNNEL_SERVICE_TOKEN_SECRET=%s\n' "$(printf %s "$RAW_SECRET" | tr -d '[:space:]')"
          } >> "$GITHUB_ENV"
      - name: Preflight Access check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${TUNNEL_SERVICE_TOKEN_ID}" \
            -H "CF-Access-Client-Secret: ${TUNNEL_SERVICE_TOKEN_SECRET}" \
            "https://${{ secrets.VPS_SSH_HOSTNAME }}/")
          echo "Access preflight HTTP ${code} (302 = token 被拒, 其他 = 已放行)"
          test "${code}" != "302"
          # 再探一次 websocket 握手路径，仅诊断用、永不致命（ws 必须走 HTTP/1.1）
          ws=$(curl --http1.1 -s -o /dev/null -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${TUNNEL_SERVICE_TOKEN_ID}" \
            -H "CF-Access-Client-Secret: ${TUNNEL_SERVICE_TOKEN_SECRET}" \
            -H "Connection: Upgrade" -H "Upgrade: websocket" \
            -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: c3NoLXByZWZsaWdodA==" \
            "https://${{ secrets.VPS_SSH_HOSTNAME }}/" || echo "curl-err")
          echo "WebSocket preflight HTTP ${ws}"
      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_SSH_HOSTNAME }}
            User ${{ secrets.VPS_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id: $TUNNEL_SERVICE_TOKEN_ID" --header "CF-Access-Client-Secret: $TUNNEL_SERVICE_TOKEN_SECRET"
          EOF
      - name: Sync deploy files
        run: |
          scp -r deploy "vps:~/unspun/"
      - name: Deploy
        run: |
          ssh vps "SERVER_IMAGE=${SERVER_IMAGE}:${{ github.sha }} \
                   WEB_IMAGE=${WEB_IMAGE}:${{ github.sha }} \
                   APP_VERSION=${{ github.sha }} \
                   bash ~/unspun/deploy/deploy.sh"
